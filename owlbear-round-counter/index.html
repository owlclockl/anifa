<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Round Counter for Owlbear Rodeo</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0d0f;
        color: #e8eaed;
        font: 15px/1.5 system-ui, sans-serif;
      }
      main { max-width: 40rem; padding: 2rem; }
      h1 { font-size: 2rem; margin-bottom: 0.5rem; }
      code { color: #9fc5e8; }
      a { color: #9fc5e8; }
    </style>
  </head>
  <body>
    <main>
      <h1>Round Counter</h1>
      <p>A small Owlbear Rodeo extension that keeps one shared round number per scene.</p>
      <p>Install it in Owlbear with your hosted <code>manifest.json</code> URL.</p>
      <p><a href="https://github.com/owlclockl/anifa">Source and instructions</a></p>
    </main>
  </body>
