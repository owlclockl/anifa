  <body>
    <main class="app">
      <header class="header">
        <div>
          <p class="eyebrow">Owlbear Rodeo</p>
          <h1>Round counter</h1>
        </div>
        <span id="role" class="role" aria-live="polite">Connecting…</span>
      </header>

      <section class="counter" aria-label="Current round">
        <button id="minus" class="step" type="button" aria-label="Previous round">−</button>
        <output id="round" class="value" aria-live="polite">1</output>
        <button id="plus" class="step" type="button" aria-label="Next round">+</button>
      </section>

      <p id="sync" class="sync" aria-live="polite">Waiting for scene…</p>

      <section class="controls" aria-label="Counter controls">
        <label class="jump">
          <span>Jump to</span>
          <input id="round-input" type="number" min="1" max="9999" step="1" inputmode="numeric" />
        </label>
        <div class="buttons">
          <button id="set" class="action" type="button">Set</button>
          <button id="reset" class="action subtle" type="button">Reset</button>
        </div>
      </section>

      <p class="hint">
        The round is shared with everyone in this scene. Only the GM can change it.
        Use ↑ / ↓ to step and Enter to apply the entered value.
      </p>
    </main>
  </body>
</html>
