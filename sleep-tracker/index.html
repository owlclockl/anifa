<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тихие заметки</title></head>
<body><div class="app">
<aside class="sidebar"><div class="brand"><span class="brand-icon">✳</span><div><strong>Тихие заметки</strong><small>Место для мыслей</small></div></div>
<button id="new-note" class="new-btn"><span>＋</span> Новая заметка <kbd>Ctrl N</kbd></button>
<div class="section-label">БИБЛИОТЕКА</div><button class="nav active" id="all-notes"><span>▤</span> Все заметки <span id="count" class="count">0</span></button><button class="nav" id="pinned-notes"><span>◇</span> Закреплённые <span id="pinned-count" class="count">0</span></button>
<div class="sidebar-bottom"><span class="status-dot"></span> Всё хранится на устройстве</div></aside>
<section class="list-panel"><header><div><span class="eyebrow">ВАША БИБЛИОТЕКА</span><h1 id="list-title">Все заметки</h1></div><button id="new-small" class="icon-btn" aria-label="Создать заметку">＋</button></header><label class="search"><span>⌕</span><input id="search" placeholder="Поиск по заметкам..." aria-label="Поиск по заметкам"><kbd>Ctrl K</kbd></label><div class="list-heading"><span>ЗАМЕТКИ</span><span id="list-count">0</span></div><div id="notes-list" class="notes-list"></div><div class="list-footer">Ваши мысли, в одном месте.</div></section>
<main class="editor-panel"><div id="empty" class="empty"><div class="empty-icon">✎</div><h2>Здесь начинается мысль</h2><p>Создайте заметку, чтобы сохранить идеи, планы и всё важное.</p><button id="empty-new" class="primary">Создать заметку <span>↗</span></button></div><div id="editor" class="editor" hidden><div class="editor-top"><span id="save-status"><i></i> Сохранено</span><div class="actions"><button id="pin" class="action" title="Закрепить заметку">◇ <span>Закрепить</span></button><button id="delete" class="action danger" title="Удалить заметку">✕ <span>Удалить</span></button></div></div><div class="paper"><div class="note-label"><span></span> ЗАМЕТКА</div><input id="title" placeholder="Без названия" aria-label="Название заметки" maxlength="200"><div class="meta"><span id="date"></span><span>·</span><span id="words">0 слов</span></div><div class="divider"></div><textarea id="body" placeholder="Начните писать..." aria-label="Текст заметки"></textarea></div><div class="editor-footer"><span>Пишите свободно.</span><span>Автосохранение включено</span></div></div></main></div><div id="toast" role="status" aria-live="polite"></div><script type="module" src="/src/main.js"></script></body></html>
