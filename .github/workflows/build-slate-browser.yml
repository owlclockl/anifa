name: Build Slate Browser APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'
    paths:
      - 'android-browser/**'
      - '.github/workflows/build-slate-browser.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Makepad build tool
        run: |
          set +e
          cargo install --git https://github.com/makepad/makepad \
            --rev 506ec05105b9adb08d1d21f9879df181b5244ea7 \
            cargo-makepad 2>&1 | tee /tmp/makepad-install.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 40 /tmp/makepad-install.log | while IFS= read -r line; do
              echo "::error::makepad install: $line"
            done
            exit "$status"
          fi

      - name: Install Android SDK and NDK
        working-directory: android-browser
        run: cargo makepad android --abi=aarch64 toolchain-install

      - name: Generate Cargo.lock
        working-directory: android-browser
        run: cargo generate-lockfile

      - name: Build the APK
        working-directory: android-browser
        run: |
          set +e
          cargo makepad android --abi=aarch64 build -p slate-browser --release 2>&1 | tee /tmp/slate-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -A8 -E 'error\[E[0-9]+\]' /tmp/slate-build.log | tr '\n' '|' | fold -w 2500 | while IFS= read -r chunk; do
              echo "::error::apk build: $chunk"
            done
            grep 'error:' /tmp/slate-build.log | tail -n 4 | while IFS= read -r line; do
              echo "::error::apk build: $line"
            done
            tail -n 40 /tmp/slate-build.log | tr '\n' '|' | fold -w 2500 | while IFS= read -r chunk; do
              echo "::error::apk build tail: $chunk"
            done
            echo "::error::apk build: full log lines: $(wc -l < /tmp/slate-build.log)"
            exit "$status"
          fi

      - name: Upload the build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: slate-build-log
          path: /tmp/slate-build.log
          if-no-files-found: ignore

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: slate-browser-apk
          path: android-browser/target/**/*.apk
          if-no-files-found: error
