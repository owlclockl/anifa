name: Build Slate Browser APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'
    paths:
      - 'android-browser/**'
      - '.github/workflows/build-slate-browser.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Makepad build tool
        run: |
          set +e
          cargo install --git https://github.com/makepad/makepad \
            --rev 506ec05105b9adb08d1d21f9879df181b5244ea7 \
            cargo-makepad 2>&1 | tee /tmp/makepad-install.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 40 /tmp/makepad-install.log | while IFS= read -r line; do
              echo "::error::makepad install: $line"
            done
            exit "$status"
          fi

      - name: Install Android SDK and NDK
        working-directory: android-browser
        run: cargo makepad android --abi=aarch64 toolchain-install

      - name: Generate Cargo.lock
        working-directory: android-browser
        run: cargo generate-lockfile

      - name: Build the APK
        working-directory: android-browser
        run: |
          set +e
          cargo makepad android --abi=aarch64 build -p slate-browser --release 2>&1 | tee /tmp/slate-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -A8 -E 'error\[E[0-9]+\]' /tmp/slate-build.log | tr '\n' '|' | fold -w 2500 | while IFS= read -r chunk; do
              echo "::error::apk build: $chunk"
            done
            grep 'error:' /tmp/slate-build.log | tail -n 4 | while IFS= read -r line; do
              echo "::error::apk build: $line"
            done
            tail -n 40 /tmp/slate-build.log | tr '\n' '|' | fold -w 2500 | while IFS= read -r chunk; do
              echo "::error::apk build tail: $chunk"
            done
            echo "::error::apk build: full log lines: $(wc -l < /tmp/slate-build.log)"
            exit "$status"
          fi

      - name: Upload the build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: slate-build-log
          path: /tmp/slate-build.log
          if-no-files-found: ignore

      - name: Verify the APK
        run: |
          set -e
          apk=$(find android-browser/target -name '*.apk' ! -name '*.unaligned.apk' -type f | head -n 1)
          if [ -z "$apk" ]; then
            echo "::error::no signed APK candidate found"
            exit 1
          fi
          echo "APK_PATH=$apk" >> "$GITHUB_ENV"

          java_bin=$(find "$HOME/.makepad" -type f -path '*/openjdk/bin/java' | head -n 1)
          signer=$(find "$HOME/.makepad" -type f -name apksigner.jar | head -n 1)
          aapt=$(find "$HOME/.makepad" -type f \( -name aapt -o -name aapt2 \) | head -n 1)
          echo "::notice::verification tools: java=$java_bin signer=$signer aapt=$aapt"
          if [ -z "$java_bin" ] || [ -z "$signer" ]; then
            echo "::error::apksigner tools not found in the installed SDK"
            exit 1
          fi

          echo "::notice::selected APK: $apk ($(stat -c%s "$apk") bytes)"
          unzip -t "$apk" > /tmp/zip-test.log
          echo "::notice::zip integrity: $(tail -n 1 /tmp/zip-test.log | tr '\n' ' ')"

          "$java_bin" -jar "$signer" verify --verbose --print-certs --min-sdk-version 26 "$apk" > /tmp/apksigner.log 2>&1 || {
            cat /tmp/apksigner.log | tr '\n' '|' | fold -w 2500 | while IFS= read -r chunk; do
              echo "::error::apksigner: $chunk"
            done
            exit 1
          }
          echo "::notice::apksigner summary: $(grep -E 'Verifies|Verified using v[123] scheme|Signer certificates|DN:' /tmp/apksigner.log | tr '\n' '|')"
          if ! grep -Eq 'Verified using v2 scheme.*true' /tmp/apksigner.log; then
            echo "::error::APK is missing an APK Signature Scheme v2 signature"
            exit 1
          fi

          if [ -n "$aapt" ]; then
            "$aapt" dump badging "$apk" > /tmp/badging.log 2>&1 || true
            echo "::notice::badging: $(grep -E '^(package|sdkVersion|targetSdkVersion|application-label|native-code)' /tmp/badging.log | tr '\n' '|')"
          fi

          echo "::notice::sha256: $(sha256sum "$apk" | cut -d' ' -f1)"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: slate-browser-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Publish the APK in a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          apk="$APK_PATH"
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          cp "$apk" slate-browser.apk
          gh release delete slate-browser-latest --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create slate-browser-latest slate-browser.apk \
            --target "$GITHUB_SHA" \
            --title "Slate Browser — latest build" \
            --notes "ARM64 APK (minSdk 26), signed and verified by apksigner. SHA-256: $sha" \
            --prerelease
