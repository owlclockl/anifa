name: Build Owlbear Round Counter

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'
    paths:
      - 'owlbear-round-counter/**'
      - '.github/workflows/build-owlbear-round-counter.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: owlbear-round-counter
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: owlbear-round-counter/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check

      - name: Build extension
        run: npm run build

      - name: Upload static extension
        uses: actions/upload-artifact@v4
        with:
          name: owlbear-round-counter
          path: owlbear-round-counter/dist/
          if-no-files-found: error
