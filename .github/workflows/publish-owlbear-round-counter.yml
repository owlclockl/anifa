name: Publish Owlbear Round Counter

on:
  push:
    tags:
      - 'owlbear-round-counter-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: owlbear-round-counter/package-lock.json

      - name: Install dependencies
        working-directory: owlbear-round-counter
        run: npm ci

      - name: Build self-contained release files
        working-directory: owlbear-round-counter
        env:
          OBR_RELEASE_TAG: ${{ github.ref_name }}
        run: npm run build:release

      - name: Archive static extension
        working-directory: owlbear-round-counter/dist
        run: zip -qr "../owlbear-round-counter-${GITHUB_REF_NAME}.zip" .

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Round Counter for Owlbear Rodeo — ${{ github.ref_name }}
          body: |
            Install in Owlbear Rodeo:

            Profile → Add Extension → paste this URL:

            https://raw.githubusercontent.com/owlclockl/anifa/${{ github.ref_name }}/owlbear-round-counter/dist/manifest-install.json?v=2

            Then enable the extension in a room. The popover is self-contained; the ZIP contains the full static build.
          files: |
            owlbear-round-counter/owlbear-round-counter-${{ github.ref_name }}.zip
            owlbear-round-counter/dist/manifest-install.json
            owlbear-round-counter/dist/extension.html
            owlbear-round-counter/dist/icon.svg
