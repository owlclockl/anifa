name: Build Quiet Notes exe

on:
  push:
    branches:
      - 'arena/b5fc70f8-anifa'
    paths:
      - 'sleep-tracker/**'
      - '.github/workflows/build-sleep-tracker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sleep-tracker/package-lock.json
      - name: Install dependencies
        working-directory: sleep-tracker
        run: npm ci
      - name: Build web assets
        working-directory: sleep-tracker
        run: npm run build
      - name: Build Windows installer
        working-directory: sleep-tracker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          npx electron-builder --win --x64 --publish never 2>&1 | Tee-Object -FilePath build-log.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $text = (Get-Content build-log.txt -Tail 20) -join '%0A'
            Write-Host "::error::$text"
            exit $code
          }
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: quiet-notes-exe
          path: sleep-tracker/release/*.exe
          if-no-files-found: error
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: quiet-notes-v1.0.0
          target_commitish: ${{ github.sha }}
          name: Quiet Notes v1.0.0
          files: sleep-tracker/release/*.exe
          fail_on_unmatched_files: true
          body: |
            Установщик Quiet Notes для Windows (64-bit). Скачайте файл .exe и запустите его. Данные хранятся на вашем компьютере.
