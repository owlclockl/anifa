name: Debug round counter CDN headers

on:
  push:
    branches:
      - arena/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  headers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Inspect jsDelivr headers
        run: |
          {
            for url in \
              'https://cdn.jsdelivr.net/gh/owlclockl/anifa@arena/b5fc70f8-anifa/xhtml-test.xhtml' \
              'https://cdn.jsdelivr.net/gh/owlclockl/anifa@arena%2Fb5fc70f8-anifa/xhtml-test.xhtml' \
              'https://cdn.jsdelivr.net/gh/owlclockl/anifa@main/README.md'; do
              echo "=== $url"
              curl -sS -I -L "$url" | grep -iE '^(HTTP/|content-type|content-disposition|x-content-type-options|access-control-allow-origin|cross-origin-resource-policy|content-security-policy|location)' || true
            done
          } > debug-headers.txt
          cat debug-headers.txt

      - name: Save header report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug-headers.txt
          git commit -m 'Save CDN header report' || true
          git push
